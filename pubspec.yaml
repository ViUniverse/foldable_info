name: foldable_info
description: Native fold geometry, hinge angles and reserved regions for iPhone Duo and Android foldables, with margins and a safe-area widget.
version: 0.3.1
homepage: https://github.com/ViUniverse/foldable_info
repository: https://github.com/ViUniverse/foldable_info
issue_tracker: https://github.com/ViUniverse/foldable_info/issues
screenshots:
  - description: A control crossing the iPhone Duo fold with avoidance disabled.
    path: doc/images/duo-before.png
  - description: FoldableSafeArea moves the control into the largest free region.
    path: doc/images/duo-after.png
  - description: Native regions and margins on the iPhone Duo portrait view.
    path: doc/images/duo-portrait.png
  - description: Live list and detail panes follow the fold in the example.
    path: doc/images/recipe-list-detail.png
  - description: Tabletop player recipe keeps the preview above the controls.
    path: doc/images/recipe-tabletop.png
  - description: A dialog stays inside its selected pane on iPhone Duo.
    path: doc/images/recipe-dialog.png
topics:
  - foldable
  - dual-screen
  - hinge
  - adaptive-ui
  - iphone-duo
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
environment:
  sdk: ^3.9.0
  flutter: '>=3.38.0'
dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.viuniverse.foldable_info
        pluginClass: FoldableInfoPlugin
      ios:
        pluginClass: FoldableInfoPlugin
