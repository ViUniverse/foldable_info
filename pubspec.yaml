name: foldable_info
description: Fold, angle and view information for Flutter through direct reads and streams.
version: 0.1.1
homepage: https://github.com/ViUniverse/foldable_info
repository: https://github.com/ViUniverse/foldable_info
issue_tracker: https://github.com/ViUniverse/foldable_info/issues
topics:
  - foldable
  - dual-screen
  - hinge
  - adaptive-ui
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
environment:
  sdk: ^3.9.0
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.viuniverse.foldable_info
        pluginClass: FoldableInfoPlugin
      ios:
        pluginClass: FoldableInfoPlugin
