name: Check package
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.38.0', '3.41.2', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
        if: matrix.flutter == 'stable'
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter build web --release
        working-directory: example
      - run: flutter pub publish --dry-run
        if: matrix.flutter == 'stable'
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.38.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug 2>&1 | tee android-build.log
        id: android_build
        working-directory: example
      - name: Report Android build failure
        if: failure() && steps.android_build.outcome == 'failure'
        working-directory: example
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          text = '\n'.join(Path('android-build.log').read_text().splitlines()[-80:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build output::' + text)
          PYTHON
      - run: ./gradlew :foldable_info:testDebugUnitTest
        working-directory: example/android
